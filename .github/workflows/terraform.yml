name: Terraform CyberArk Demo

on:
  push:
    branches:
      - main

# Required to request the OIDC JWT from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Trade the GitHub OIDC token for a Conjur access token
      - name: Fetch CyberArk service user
        uses: cyberark/conjur-action@v3.0.1
        with:
          url: https://anzdeeks.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: Github
          host_id: host/data/hello-world
          secrets: data/vault/Github/client_id/password|IDSEC_SERVICE_USER

      - name: Fetch CyberArk service token
        uses: cyberark/conjur-action@v3.0.1
        with:
          url: https://anzdeeks.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: Github
          host_id: host/data/hello-world
          secrets: data/vault/Github/client_secret/password|IDSEC_SERVICE_TOKEN

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan