name: Terraform CyberArk Demo

on:
  push:
    branches:
      - main

# Required to request the OIDC JWT from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Trade the GitHub OIDC token for a Conjur access token
      - name: Fetch CyberArk Secrets
        uses: cyberark/conjur-action@v3.0.1
        id: conjur
        with:
          url: https://anzdeeks.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: Github # The name of the authenticator you created
          host_id: host/data/hello-world
          secrets: |
            data/vault/Github/client_id/password|IDSEC_SERVICE_USER
            data/vault/Github/client_secret/password|IDSEC_SERVICE_TOKEN

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

# Run Terraform, injecting the secrets into memory
      - name: Terraform Plan & Apply
        env:
              IDSEC_SERVICE_USER: ${{ env.IDSEC_SERVICE_USER }}
              IDSEC_SERVICE_TOKEN: ${{ env.IDSEC_SERVICE_TOKEN }}
              IDSEC_SUBDOMAIN: "anzdeeks"
              TF_LOG: DEBUG
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan