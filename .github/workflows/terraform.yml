name: Terraform CyberArk Demo

on:
  push:
    branches:
      - main

# Required to request the OIDC JWT from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Trade the GitHub OIDC token for a Conjur access token
      - name: Fetch CyberArk Secrets
        uses: cyberark/conjur-action@v3.0.1
        id: conjur
        with:
          url: https://anzdeeks.secretsmgr.cyberark.cloud/api
          account: conjur
          authn_id: github # The name of the authenticator you created
          secrets: |
            secrets/github/client_id|IDSEC_SERVICE_USER
            secrets/github/client_secret|IDSEC_SERVICE_TOKEN

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # Run Terraform, injecting the secrets into memory
      - name: Terraform Plan & Apply
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan